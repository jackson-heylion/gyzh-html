name: Browser playtest (live GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser.mjs'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-playtest
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser playtest (desktop + mobile)
        run: node tests/browser.mjs
        env:
          GAME_URL: https://jackson-heylion.github.io/gyzh-html/
      - name: Upload screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-game-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
