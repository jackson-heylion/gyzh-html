name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and package site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run RPG smoke tests
        run: npm test
      - name: Build static HTML5 game
        run: npm run build
      - name: Check all site entry points
        run: |
          test -s dist/index.html
          test -s dist/game.js
          test -s dist/hd-art.js
          test -s dist/style.css
          test -s dist/favicon.svg
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Publish playable game
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
